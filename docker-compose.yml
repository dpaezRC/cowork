services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: cowork_sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'yourStrong#Password'
      MSSQL_PID: 'Developer'
    ports:
      - '1433:1433'
    volumes:
      - ./.docker/data/sqlserver_dev:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -C -Q 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: cowork_db_init
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./CoworkApp/Scripts:/scripts:ro
    environment:
      MSSQL_SA_PASSWORD: 'yourStrong#Password'
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -d master -b -Q "IF DB_ID(N'cowork') IS NULL CREATE DATABASE cowork;"
        echo "Aplicando 001_Esquema.sql sobre cowork..."
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -d cowork -b -i /scripts/001_Esquema.sql
        echo "Esquema aplicado correctamente."
