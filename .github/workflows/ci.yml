name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        cache: true
        cache-dependency-path: '**/*.csproj'
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --configuration Release
    - name: Test
      run: dotnet test CoworkApp.Tests/CoworkApp.Tests.csproj --no-build --configuration Release --verbosity normal
    - name: Publish
      if: github.event_name == 'push'
      run: >
        dotnet publish CoworkApp/CoworkApp.csproj
        -c Release -r win-x64
        --self-contained true
        -p:PublishSingleFile=true
        -p:PublishTrimmed=false
        -o ./publish
    - name: Upload artifact
      if: github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: CoworkApp-win-x64-${{ github.ref_name }}
        path: ./publish
        if-no-files-found: error
        retention-days: 14
